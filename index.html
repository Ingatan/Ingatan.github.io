<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyTaskReward</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { min-height: 100vh; }
    .check-card { cursor: grab; user-select: none; transition: transform .12s ease, opacity .12s ease; }
    .check-card:active { cursor: grabbing; transform: scale(.96); }
    .check-card.disabled { cursor: not-allowed; filter: grayscale(1); opacity: .45; }
    .modal-backdrop { backdrop-filter: blur(4px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">
  <div id="app" class="max-w-6xl mx-auto p-4 md:p-8 h-full flex flex-col"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import {
      getDatabase,
      ref,
      get,
      set,
      update as firebaseUpdate,
      onValue,
      off,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

    /*
      1. 去 Firebase 控制台创建 Web App。
      2. 把 Firebase SDK 配置粘贴到这里。
      3. 开启 Realtime Database 后，房间会保存到 /rooms/{6位房间号}。
    */
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyD9G8898gLd_ssaqL4tD6S8dS-8hQFetMM',
      authDomain: 'dailytaskreward.firebaseapp.com',
      databaseURL: 'https://dailytaskreward-default-rtdb.firebaseio.com',
      projectId: 'dailytaskreward',
      storageBucket: 'dailytaskreward.firebasestorage.app',
      messagingSenderId: '211834335994',
      appId: '1:211834335994:web:84599ec3bae98399dd8f43',
      measurementId: 'G-W1ZXSJ69P2'
    };

    const STORAGE_KEY = 'dailyTaskSave';
    const CLIENT_ID_KEY = 'dailyTaskClientId';
    const MONEY_VALUES = [10, 20, 50, 100];
    const ROOM_RE = /^[0-9]{6}$/;

    const appRoot = document.getElementById('app');
    const firebaseConfigured = !Object.values(FIREBASE_CONFIG).some((value) => String(value).includes('YOUR_'));
    const firebaseApp = firebaseConfigured ? initializeApp(FIREBASE_CONFIG) : null;
    const database = firebaseConfigured ? getDatabase(firebaseApp) : null;

    let activeRoomRef = null;
    let syncingFromCloud = false;
    let cloudSaveTimer = null;

    function createClientId() {
      const saved = localStorage.getItem(CLIENT_ID_KEY);
      if (saved) return saved;
      const id = crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      localStorage.setItem(CLIENT_ID_KEY, id);
      return id;
    }

    const defaultSharedState = () => ({
      day: 1,
      tasks: [],
      nextTaskId: 1,
      b_state: 'planning',
      b_satisfied: null,
      a_satisfied: null,
      a_reward: { 10: 1, 20: 0, 50: 0, 100: 0 },
      checks: { 10: 0, 20: 0, 50: 0, 100: 0 },
      logs: [],
      storageLogs: []
    });

    const defaultState = () => ({
      role: 'none',
      roomInput: '',
      roomCode: '',
      roomJoined: false,
      roomBusy: false,
      roomError: '',
      cloudStatus: firebaseConfigured ? '等待连接房间' : 'Firebase 未配置，当前只能本地使用',
      clientId: createClientId(),
      newTaskText: '',
      b_promptMinimized: false,
      a_promptMinimized: false,
      warehouseOpen: false,
      draggedAmount: null,
      isDragOver: false,
      ...defaultSharedState()
    });

    let state = defaultState();

    function moneyLabel(value) {
      return `¥${value}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalizeMoneyMap(input, fallback) {
      const result = { ...fallback };
      MONEY_VALUES.forEach((value) => {
        const parsed = Number(input?.[value]);
        result[value] = Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : 0;
      });
      return result;
    }

    function sanitizeTasks(tasks) {
      return Array.isArray(tasks) ? tasks.map((task) => ({
        id: Number(task.id) || 0,
        text: String(task.text || ''),
        done: Boolean(task.done)
      })) : [];
    }

    function extractSharedState() {
      return {
        day: state.day,
        tasks: sanitizeTasks(state.tasks),
        nextTaskId: state.nextTaskId,
        b_state: state.b_state,
        b_satisfied: state.b_satisfied,
        a_satisfied: state.a_satisfied,
        a_reward: state.a_reward,
        checks: state.checks,
        logs: state.logs,
        storageLogs: state.storageLogs
      };
    }

    function applySharedState(shared = {}) {
      const fallback = defaultSharedState();
      state.day = Number(shared.day) || fallback.day;
      state.tasks = sanitizeTasks(shared.tasks).map((task) => ({
        ...task,
        isEditing: false,
        editTempText: ''
      }));
      state.nextTaskId = Number(shared.nextTaskId) || Math.max(0, ...state.tasks.map((task) => task.id)) + 1;
      state.b_state = shared.b_state === 'waiting' ? 'waiting' : 'planning';
      state.b_satisfied = shared.b_satisfied === true ? true : shared.b_satisfied === false ? false : null;
      state.a_satisfied = shared.a_satisfied === true ? true : shared.a_satisfied === false ? false : null;
      state.a_reward = normalizeMoneyMap(shared.a_reward, fallback.a_reward);
      state.checks = normalizeMoneyMap(shared.checks, fallback.checks);
      state.logs = Array.isArray(shared.logs) ? shared.logs : [];
      state.storageLogs = Array.isArray(shared.storageLogs) ? shared.storageLogs : [];
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        role: state.role,
        roomInput: state.roomInput,
        roomCode: state.roomCode,
        roomJoined: state.roomJoined,
        ...extractSharedState()
      }));
    }

    function loadLocal() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        state.role = parsed.role || 'none';
        state.roomInput = parsed.roomInput || '';
        state.roomCode = parsed.roomCode || '';
        applySharedState(parsed);
      } catch (error) {
        console.error('存档读取失败：', error);
      }
    }

    function scheduleCloudSave() {
      if (!state.roomJoined || !activeRoomRef || syncingFromCloud) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => {
        firebaseUpdate(activeRoomRef, {
          shared: extractSharedState(),
          updatedAt: serverTimestamp()
        }).catch((error) => {
          state.cloudStatus = `云端保存失败：${error.message}`;
          render();
        });
      }, 180);
    }

    function updateLocal(mutator, shouldSave = true) {
      mutator();
      if (shouldSave) {
        saveLocal();
        scheduleCloudSave();
      }
      render();
    }

    function generateRoomCode() {
      return String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
    }

    function roomPath(code) {
      return `rooms/${code}`;
    }

    async function createRoom() {
      if (!firebaseConfigured) {
        updateLocal(() => { state.roomError = '请先填写 Firebase 配置，再创建云端房间。'; }, false);
        return;
      }
      if (state.role === 'none') return;

      updateLocal(() => {
        state.roomBusy = true;
        state.roomError = '';
        state.cloudStatus = '正在创建房间...';
      }, false);

      try {
        for (let i = 0; i < 30; i++) {
          const code = generateRoomCode();
          const candidateRef = ref(database, roomPath(code));
          const snapshot = await get(candidateRef);
          if (snapshot.exists()) continue;

          await set(candidateRef, {
            code,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            members: {
              [state.clientId]: {
                role: state.role,
                joinedAt: serverTimestamp()
              }
            },
            shared: extractSharedState()
          });
          joinRoomListener(code);
          return;
        }
        throw new Error('连续生成的房间号都已存在，请再试一次。');
      } catch (error) {
        updateLocal(() => {
          state.roomBusy = false;
          state.roomError = error.message;
          state.cloudStatus = '创建房间失败';
        }, false);
      }
    }

    async function joinRoom() {
      const code = state.roomInput.trim();
      if (!ROOM_RE.test(code)) {
        updateLocal(() => { state.roomError = '房间号必须是 6 位数字。'; }, false);
        return;
      }
      if (!firebaseConfigured) {
        updateLocal(() => { state.roomError = '请先填写 Firebase 配置，再加入云端房间。'; }, false);
        return;
      }

      updateLocal(() => {
        state.roomBusy = true;
        state.roomError = '';
        state.cloudStatus = '正在加入房间...';
      }, false);

      try {
        const targetRef = ref(database, roomPath(code));
        const snapshot = await get(targetRef);
        if (!snapshot.exists()) throw new Error('这个房间不存在，请确认房间号。');

        const room = snapshot.val() || {};
        const members = room.members || {};
        const memberIds = Object.keys(members);
        const alreadyInRoom = Boolean(members[state.clientId]);
        if (!alreadyInRoom && memberIds.length >= 2) {
          throw new Error('这个房间已经满员，最多只能容纳两个人。');
        }

        await firebaseUpdate(targetRef, {
          [`members/${state.clientId}`]: {
            role: state.role,
            joinedAt: serverTimestamp()
          },
          updatedAt: serverTimestamp()
        });
        joinRoomListener(code);
      } catch (error) {
        updateLocal(() => {
          state.roomBusy = false;
          state.roomError = error.message;
          state.cloudStatus = '加入房间失败';
        }, false);
      }
    }

    function joinRoomListener(code) {
      if (activeRoomRef) off(activeRoomRef);
      activeRoomRef = ref(database, roomPath(code));
      state.roomCode = code;
      state.roomInput = code;
      state.roomJoined = true;
      state.roomBusy = false;
      state.roomError = '';
      state.cloudStatus = `已连接房间 ${code}`;
      saveLocal();

      onValue(activeRoomRef, (snapshot) => {
        const room = snapshot.val();
        if (!room?.shared) return;
        syncingFromCloud = true;
        applySharedState(room.shared);
        state.cloudStatus = `已连接房间 ${code}`;
        saveLocal();
        render();
        syncingFromCloud = false;
      }, (error) => {
        state.cloudStatus = `云端监听失败：${error.message}`;
        render();
      });
      render();
    }

    function leaveRoom() {
      if (activeRoomRef) off(activeRoomRef);
      activeRoomRef = null;
      updateLocal(() => {
        state.roomJoined = false;
        state.roomCode = '';
        state.roomInput = '';
        state.cloudStatus = firebaseConfigured ? '已退出房间' : 'Firebase 未配置，当前只能本地使用';
      }, false);
    }

    function buttonClass(active, color) {
      if (active && color === 'green') return 'bg-green-500 text-white shadow-inner';
      if (active && color === 'red') return 'bg-red-500 text-white shadow-inner';
      if (active && color === 'blue') return 'bg-blue-500 text-white shadow-inner';
      return 'bg-slate-100 text-slate-600 hover:bg-slate-200';
    }

    function renderHeader() {
      const roomBadge = state.roomJoined
        ? `<span class="bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1 rounded text-sm font-bold">房间 ${state.roomCode}</span>`
        : '';
      const roleText = state.role === 'A' ? '甲方（发钱方）' : state.role === 'B' ? '乙方（攒钱方）' : '未选择';
      const roleDot = state.role === 'A' ? 'bg-blue-500' : 'bg-green-500';
      const controls = state.role === 'none' ? '' : `
        <div class="flex flex-wrap items-center justify-end gap-3">
          ${roomBadge}
          <span class="text-xs text-slate-400">${escapeHtml(state.cloudStatus)}</span>
          <div class="flex flex-wrap gap-2">
            <button data-action="export" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1 rounded text-sm transition">导出存档</button>
            <label class="bg-teal-100 hover:bg-teal-200 text-teal-700 px-3 py-1 rounded text-sm transition cursor-pointer">
              导入存档
              <input id="importFile" type="file" accept=".json,application/json" class="hidden">
            </label>
            <button data-action="clear" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded text-sm transition">重新开始</button>
          </div>
          <span class="font-bold flex items-center gap-2 border-l pl-4 border-slate-300">
            <span class="w-3 h-3 rounded-full ${roleDot}"></span>
            <span>当前视角：${roleText}</span>
          </span>
          <button data-action="switch-role" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition">切换视角</button>
          ${state.roomJoined ? `<button data-action="leave-room" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">退出房间</button>` : ''}
        </div>`;

      return `
        <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
          <h1 class="text-2xl font-black text-indigo-600 tracking-wide">
            Day ${state.day}<span class="text-slate-400 font-medium text-lg ml-2">| DailyTaskReward</span>
          </h1>
          ${controls}
        </header>`;
    }

    function renderRoleSelect() {
      return `
        <main class="flex flex-col items-center justify-center flex-1 py-20">
          <h2 class="text-3xl font-bold mb-10 text-slate-700">欢迎，请选择你的身份</h2>
          <div class="flex flex-col sm:flex-row gap-8">
            <button data-action="choose-role" data-role="A" class="w-64 h-64 bg-white border-4 border-blue-500 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-2 transition-all flex flex-col items-center justify-center group">
              <span class="text-6xl mb-4 group-hover:scale-110 transition-transform">💸</span>
              <span class="text-2xl font-bold text-blue-600">我是甲方</span>
              <span class="text-slate-500 mt-2 font-medium">发钱方 / 监督者</span>
            </button>
            <button data-action="choose-role" data-role="B" class="w-64 h-64 bg-white border-4 border-green-500 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-2 transition-all flex flex-col items-center justify-center group">
              <span class="text-6xl mb-4 group-hover:scale-110 transition-transform">📝</span>
              <span class="text-2xl font-bold text-green-600">我是乙方</span>
              <span class="text-slate-500 mt-2 font-medium">攒钱方 / 执行者</span>
            </button>
          </div>
          <p class="mt-8 text-slate-400 italic text-center">祝你早日攒下足够的钱，买到想买的东西；也祝你学习进步，工作顺利。</p>
        </main>`;
    }

    function renderRoomGate() {
      const roleName = state.role === 'A' ? '甲方' : '乙方';
      return `
        <main class="flex justify-center py-12">
          <section class="bg-white border border-slate-200 shadow-sm rounded-2xl p-8 w-full max-w-2xl">
            <div class="flex items-center justify-between gap-4 border-b border-slate-100 pb-5 mb-6">
              <div>
                <p class="text-sm text-slate-400 mb-1">当前身份</p>
                <h2 class="text-2xl font-black text-slate-800">${roleName}</h2>
              </div>
              <button data-action="back-role" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold">重新选择身份</button>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
              <div class="bg-slate-50 border border-slate-100 rounded-xl p-5">
                <h3 class="font-bold text-lg mb-2 text-slate-800">创建房间</h3>
                <p class="text-sm text-slate-500 mb-5">系统会自动生成 6 位数字房间号，并在云端创建一份新的共享数据。</p>
                <button data-action="create-room" ${state.roomBusy || !firebaseConfigured ? 'disabled' : ''} class="w-full bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition">创建房间号</button>
              </div>
              <div class="bg-slate-50 border border-slate-100 rounded-xl p-5">
                <h3 class="font-bold text-lg mb-2 text-slate-800">加入房间</h3>
                <p class="text-sm text-slate-500 mb-4">输入对方给你的 6 位数字房间号。每个房间最多两个人。</p>
                <input id="roomInput" value="${escapeHtml(state.roomInput)}" inputmode="numeric" maxlength="6" placeholder="例如 123456" class="w-full border-2 border-slate-200 rounded-lg p-3 outline-none focus:border-indigo-400 tracking-[.3em] text-center font-black text-lg mb-3">
                <button data-action="join-room" ${state.roomBusy || !firebaseConfigured ? 'disabled' : ''} class="w-full bg-slate-800 hover:bg-slate-900 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition">加入已有房间</button>
              </div>
            </div>
            ${!firebaseConfigured ? `<div class="mt-6 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-4 text-sm">Firebase 尚未配置。请先按我给你的步骤填写 <code>FIREBASE_CONFIG</code>，再使用云端房间。</div>` : ''}
            ${state.roomError ? `<div class="mt-6 bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 text-sm">${escapeHtml(state.roomError)}</div>` : ''}
            <p class="mt-5 text-xs text-slate-400">状态：${escapeHtml(state.cloudStatus)}</p>
          </section>
        </main>`;
    }

    function renderTaskList(editable) {
      if (!state.tasks.length) {
        return `<li class="text-slate-400 italic flex items-center justify-center min-h-24">${editable ? '还没有制定计划，快在上方添加吧。' : '乙方今日尚未添加任何计划。'}</li>`;
      }

      return state.tasks.map((task) => {
        const textClass = task.done ? 'line-through text-slate-400' : 'font-medium text-slate-700';
        const editControls = editable && state.b_state === 'planning' ? `
          <div class="flex gap-2 ml-4 flex-shrink-0 mt-0.5">
            ${task.isEditing ? `
              <button data-action="save-edit" data-id="${task.id}" class="text-sm bg-green-100 text-green-600 hover:bg-green-200 px-3 py-1 rounded transition">保存</button>
              <button data-action="cancel-edit" data-id="${task.id}" class="text-sm bg-slate-200 text-slate-600 hover:bg-slate-300 px-3 py-1 rounded transition">取消</button>
            ` : `
              <button data-action="start-edit" data-id="${task.id}" class="text-sm bg-blue-100 text-blue-600 hover:bg-blue-200 px-3 py-1 rounded transition">修改</button>
              <button data-action="delete-task" data-id="${task.id}" class="text-sm bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded transition">删除</button>
            `}
          </div>` : '';

        return `
          <li class="flex items-start justify-between text-lg bg-slate-50 p-3 rounded-lg border border-slate-100 hover:border-slate-300 transition">
            <div class="flex items-start gap-4 flex-grow min-w-0">
              <input data-action="toggle-task" data-id="${task.id}" type="checkbox" ${task.done ? 'checked' : ''} ${editable && state.b_state === 'planning' ? '' : 'disabled'} class="w-6 h-6 mt-1 rounded border-slate-300 text-green-600 focus:ring-green-500 flex-shrink-0">
              <div class="flex-grow min-w-0">
                ${task.isEditing ? `
                  <textarea data-edit-id="${task.id}" rows="2" class="w-full border-2 border-slate-300 rounded p-2 text-sm outline-none focus:border-green-500 transition resize-none">${escapeHtml(task.editTempText)}</textarea>
                ` : `
                  <div class="whitespace-pre-wrap break-words ${textClass}">${escapeHtml(task.text)}</div>
                `}
              </div>
            </div>
            ${editControls}
          </li>`;
      }).join('');
    }

    function renderBView() {
      const selfReview = state.tasks.length && state.b_state === 'planning' ? `
        <div class="border-t-2 border-dashed border-slate-200 pt-6">
          <p class="font-bold text-lg mb-4 text-slate-700">每日自评：是否满意自己今天完成的工作量？</p>
          <div class="flex gap-4">
            <button data-action="b-satisfied" data-value="true" class="px-6 py-3 rounded-xl font-bold transition ${buttonClass(state.b_satisfied === true, 'green')}">满意</button>
            <button data-action="b-satisfied" data-value="false" class="px-6 py-3 rounded-xl font-bold transition ${buttonClass(state.b_satisfied === false, 'red')}">不满意</button>
          </div>
        </div>` : '';

      const waiting = state.b_state === 'waiting' ? `
        <div class="mt-4 bg-amber-50 text-amber-700 p-4 rounded-lg border border-amber-200 font-medium">
          已完成今日操作，正在等待甲方审核并同意进入下一天。
        </div>` : '';

      const nextPrompt = state.b_satisfied !== null && state.b_state === 'planning' ? `
        <div class="fixed bottom-32 right-8 bg-white p-6 rounded-2xl shadow-2xl border border-slate-200 z-40 w-80 transform transition-all ${state.b_promptMinimized ? 'translate-y-48 opacity-50 hover:opacity-100 hover:translate-y-40 cursor-pointer' : ''}" data-action="${state.b_promptMinimized ? 'expand-b-prompt' : ''}">
          ${state.b_promptMinimized ? `
            <div class="text-center font-bold text-indigo-600">展开：是否进入下一天？</div>
          ` : `
            <p class="font-bold text-lg mb-4 text-slate-800">当天总结已完成。是否进入下一天？</p>
            <div class="flex justify-end gap-3">
              <button data-action="request-next-day" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2 rounded-lg font-bold">是</button>
              <button data-action="minimize-b-prompt" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-5 py-2 rounded-lg font-bold">否</button>
            </div>
          `}
        </div>` : '';

      return `
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-4">Schedule</h2>
          ${state.b_state === 'planning' ? `
            <div class="flex mb-6">
              <textarea id="newTaskText" rows="2" placeholder="输入今天的计划内容，支持换行..." class="flex-grow border-2 border-r-0 border-slate-300 rounded-l-lg p-3 outline-none focus:border-green-500 transition resize-none">${escapeHtml(state.newTaskText)}</textarea>
              <button data-action="add-task" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-r-lg transition">添加日程</button>
            </div>` : ''}
          <ul class="space-y-3 mb-8 min-h-[150px]">${renderTaskList(true)}</ul>
          ${selfReview}
          ${waiting}
          ${nextPrompt}
        </div>
        <button data-action="open-warehouse" class="fixed bottom-8 right-8 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-yellow-900 font-extrabold px-6 py-4 rounded-full shadow-2xl flex items-center justify-center transform hover:scale-110 transition z-30 border-2 border-yellow-300">支票仓库</button>
        ${state.warehouseOpen ? renderWarehouse() : ''}`;
    }

    function renderRewardPicker() {
      if (!state.a_satisfied) return '';
      return `
        <div class="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-100">
          <p class="font-bold text-slate-700 mb-3">请选择要发放的支票类型和数量：</p>
          <div class="flex flex-wrap gap-4">
            ${MONEY_VALUES.map((value) => `
              <div class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
                <span class="font-medium text-yellow-700 w-12 text-center bg-yellow-50 rounded">${moneyLabel(value)}</span>
                <button data-action="reward-minus" data-value="${value}" class="w-8 h-8 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition">-</button>
                <span class="w-6 text-center font-bold text-slate-800">${state.a_reward[value]}</span>
                <button data-action="reward-plus" data-value="${value}" class="w-8 h-8 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition">+</button>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    function renderAView() {
      const status = state.b_state === 'planning' ? `
        <div class="bg-slate-50 text-slate-500 p-4 rounded-lg border border-slate-100 font-medium">
          乙方仍在安排或完成任务中，甲方目前无需操作。
        </div>` : `
        <div class="border-t-2 border-dashed border-slate-200 pt-6">
          <p class="font-bold text-lg mb-4 text-slate-700">乙方已结束一天。是否满意对方的工作量，并发放支票？</p>
          <div class="flex gap-4">
            <button data-action="a-satisfied" data-value="true" class="px-6 py-3 rounded-xl font-bold transition ${buttonClass(state.a_satisfied === true, 'blue')}">满意，发支票</button>
            <button data-action="a-satisfied" data-value="false" class="px-6 py-3 rounded-xl font-bold transition ${buttonClass(state.a_satisfied === false, 'red')}">不满意，不发放</button>
          </div>
          ${renderRewardPicker()}
        </div>`;

      const nextPrompt = state.a_satisfied !== null ? `
        <div class="fixed bottom-8 right-8 bg-white p-6 rounded-2xl shadow-2xl border border-slate-200 z-40 w-80 transform transition-all ${state.a_promptMinimized ? 'translate-y-48 opacity-50 hover:opacity-100 hover:translate-y-40 cursor-pointer' : ''}" data-action="${state.a_promptMinimized ? 'expand-a-prompt' : ''}">
          ${state.a_promptMinimized ? `
            <div class="text-center font-bold text-blue-600">展开：是否同意进入下一天？</div>
          ` : `
            <p class="font-bold text-lg mb-4 text-slate-800">是否同意进入下一天？</p>
            <div class="flex justify-end gap-3">
              <button data-action="approve-next-day" class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-bold">是</button>
              <button data-action="minimize-a-prompt" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-5 py-2 rounded-lg font-bold">否</button>
            </div>
          `}
        </div>` : '';

      return `
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-4">乙方日程监控</h2>
          <ul class="space-y-3 mb-8 min-h-[150px] opacity-90">${renderTaskList(false)}</ul>
          ${status}
          ${nextPrompt}
        </div>`;
    }

    function renderWarehouse() {
      return `
        <div class="fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center z-50 p-4 modal-backdrop">
          <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl h-[80vh] flex flex-col overflow-hidden border border-slate-200">
            <div class="px-8 py-5 bg-gradient-to-r from-amber-200 to-yellow-400 text-yellow-900 font-black text-2xl flex justify-between items-center border-b border-yellow-500">
              <div class="flex items-center gap-3">
                <span>我的支票仓库</span>
                <span class="bg-white text-sm px-3 py-1 rounded-full border border-yellow-500">资产管理</span>
              </div>
              <button data-action="close-warehouse" class="text-4xl hover:text-white transition w-10 h-10 flex items-center justify-center rounded-full hover:bg-yellow-600 hover:bg-opacity-30">&times;</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 flex-1 overflow-hidden">
              <section class="border-r border-slate-200 bg-amber-50 p-6 overflow-y-auto">
                <h3 class="text-xl font-bold mb-6 text-slate-800">合成区域</h3>
                <p class="text-sm text-slate-500 mb-4">低额支票可以合成为高额支票：</p>
                <div class="space-y-4 font-medium">
                  ${combineRow('2 张 ¥10 → 1 张 ¥20', '10', state.checks[10] < 2)}
                  ${combineRow('2 张 ¥20 + 1 张 ¥10 → 1 张 ¥50', '20-10-50', state.checks[20] < 2 || state.checks[10] < 1)}
                  ${combineRow('2 张 ¥50 → 1 张 ¥100', '50', state.checks[50] < 2)}
                </div>
              </section>
              <section class="border-r border-slate-200 bg-white p-6 flex flex-col overflow-hidden">
                <h3 class="text-xl font-bold mb-2 text-slate-800">存储区</h3>
                <p class="text-sm text-slate-400 mb-6 italic">按住并拖拽下方支票到右侧交付区即可兑现。</p>
                <div class="grid grid-cols-2 gap-6 content-start mb-4 overflow-y-auto" style="height: 58%;">
                  ${MONEY_VALUES.map((value) => `
                    <div class="flex flex-col items-center p-4 bg-slate-50 rounded-xl border border-slate-100">
                      <div draggable="${state.checks[value] > 0}" data-drag-value="${value}" class="check-card ${state.checks[value] === 0 ? 'disabled' : ''} w-28 h-16 bg-gradient-to-br from-yellow-100 to-yellow-300 border-2 border-yellow-500 rounded-lg shadow-md flex items-center justify-center relative overflow-hidden">
                        <span class="font-black text-yellow-800 text-xl z-10">${moneyLabel(value)}</span>
                      </div>
                      <span class="mt-3 text-slate-700 font-bold bg-white px-3 py-1 rounded-full shadow-sm text-sm border border-slate-200">
                        拥有：<span class="text-indigo-600">${state.checks[value]}</span> 张
                      </span>
                    </div>
                  `).join('')}
                </div>
                <h3 class="text-lg font-bold mb-3 text-slate-700 border-t border-slate-200 pt-4">存取日志</h3>
                <ul class="flex-1 overflow-y-auto space-y-2 pr-2 min-h-0">${renderStorageLogs()}</ul>
              </section>
              <section class="bg-green-50 p-6 flex flex-col overflow-hidden">
                <h3 class="text-xl font-bold mb-6 text-slate-800">交付区</h3>
                <div data-drop-zone="true" class="w-full h-40 border-4 border-dashed rounded-2xl flex flex-col items-center justify-center mb-8 transition-colors select-none ${state.isDragOver ? 'border-green-500 bg-green-200 scale-105' : 'border-green-400 bg-green-100 hover:bg-green-200 text-green-700'}">
                  <span class="font-bold text-lg text-green-800">拖拽支票到此框内完成兑现</span>
                  <span class="text-sm text-green-600 mt-1">现实中由甲方发放等值货币</span>
                </div>
                <h3 class="text-lg font-bold mb-3 text-slate-700 border-b-2 border-slate-200 pb-2">兑现日志</h3>
                <ul class="flex-1 overflow-y-auto space-y-3 pr-2">${renderCashLogs()}</ul>
              </section>
            </div>
          </div>
        </div>`;
    }

    function combineRow(label, value, disabled) {
      return `
        <div class="bg-white p-4 justify-between items-center flex rounded-xl shadow-sm border border-amber-200 gap-4">
          <span class="text-slate-700">${label}</span>
          <button data-action="combine" data-value="${value}" ${disabled ? 'disabled' : ''} class="bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg text-sm font-bold transition">合成</button>
        </div>`;
    }

    function renderStorageLogs() {
      if (!state.storageLogs.length) {
        return `<li class="text-xs text-slate-400 italic text-center py-2 bg-slate-50 rounded-lg border border-dashed border-slate-200">暂无资产变动记录。</li>`;
      }
      return state.storageLogs.slice().reverse().map((log) => `
        <li class="flex items-center justify-between gap-3 text-xs bg-slate-50 p-2 border border-slate-100 rounded-lg text-slate-600 shadow-sm">
          <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold">Day ${escapeHtml(log.day)}</span>
          <span class="font-bold text-slate-700 text-right">${escapeHtml(log.detail)}</span>
        </li>`).join('');
    }

    function renderCashLogs() {
      if (!state.logs.length) {
        return `<li class="text-sm text-slate-400 italic text-center py-4 bg-white bg-opacity-50 rounded-lg border border-dashed border-slate-300">暂无兑现记录。</li>`;
      }
      return state.logs.slice().reverse().map((log) => `
        <li class="flex items-center justify-between text-sm bg-white p-3 border border-slate-200 rounded-lg shadow-sm font-mono text-slate-700">
          <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs font-bold">Day ${escapeHtml(log.day)}</span>
          <span class="font-bold text-green-600">+ ${escapeHtml(log.amount)} RMB</span>
        </li>`).join('');
    }

    function render() {
      appRoot.innerHTML = `
        ${renderHeader()}
        ${state.role === 'none'
          ? renderRoleSelect()
          : state.roomJoined
            ? `<main class="grid grid-cols-1 gap-8">${state.role === 'B' ? renderBView() : renderAView()}</main>`
            : renderRoomGate()
        }
      `;
      bindInputs();
    }

    function bindInputs() {
      const newTask = document.getElementById('newTaskText');
      if (newTask) {
        newTask.addEventListener('input', (event) => {
          state.newTaskText = event.target.value;
        });
      }
      const roomInput = document.getElementById('roomInput');
      if (roomInput) {
        roomInput.addEventListener('input', (event) => {
          state.roomInput = event.target.value.replace(/\D/g, '').slice(0, 6);
          event.target.value = state.roomInput;
        });
      }
      document.querySelectorAll('[data-edit-id]').forEach((textarea) => {
        textarea.addEventListener('input', (event) => {
          const task = findTask(event.target.dataset.editId);
          if (task) task.editTempText = event.target.value;
        });
      });
      const input = document.getElementById('importFile');
      if (input) input.addEventListener('change', importData);
    }

    function findTask(id) {
      return state.tasks.find((task) => String(task.id) === String(id));
    }

    function addTask() {
      const text = state.newTaskText.trim();
      if (!text) return;
      state.tasks.push({
        id: state.nextTaskId++,
        text,
        done: false,
        isEditing: false,
        editTempText: ''
      });
      state.newTaskText = '';
    }

    function approveNextDay() {
      if (state.a_satisfied) {
        const details = [];
        MONEY_VALUES.forEach((value) => {
          const count = state.a_reward[value];
          if (count > 0) {
            state.checks[value] += count;
            details.push(`${count} 张 ${moneyLabel(value)}`);
          }
        });
        if (details.length) {
          state.storageLogs.push({ day: state.day, detail: `完成任务获得：${details.join('，')}` });
        }
      }

      state.day += 1;
      state.tasks = [];
      state.newTaskText = '';
      state.b_state = 'planning';
      state.b_satisfied = null;
      state.b_promptMinimized = false;
      state.a_satisfied = null;
      state.a_promptMinimized = false;
      state.a_reward = { 10: 1, 20: 0, 50: 0, 100: 0 };
    }

    async function exportData() {
      const dataStr = JSON.stringify({
        role: state.role,
        roomCode: state.roomCode,
        ...extractSharedState()
      });
      const defaultFileName = `每日任务存档_Day${state.day}.json`;

      if (window.showSaveFilePicker) {
        try {
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: defaultFileName,
            types: [{
              description: 'JSON 存档文件',
              accept: { 'application/json': ['.json'] },
            }],
          });
          const writable = await fileHandle.createWritable();
          await writable.write(dataStr);
          await writable.close();
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
          console.warn('高级保存失败，将退回到默认下载方式：', error);
        }
      }

      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = defaultFileName;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (readerEvent) => {
        try {
          const parsed = JSON.parse(readerEvent.target.result);
          updateLocal(() => {
            applySharedState(parsed);
          });
          alert(`导入成功，已同步到 Day ${state.day}`);
        } catch (error) {
          console.error('导入失败：', error);
          alert('导入失败，请确认文件是本工具导出的 JSON 存档。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearData() {
      if (!confirm('确定删除当前本地进度并重新开始吗？云端房间里的共享数据不会被删除。')) return;
      localStorage.removeItem(STORAGE_KEY);
      if (activeRoomRef) off(activeRoomRef);
      activeRoomRef = null;
      state = defaultState();
      render();
    }

    appRoot.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'create-room') { createRoom(); return; }
      if (action === 'join-room') { joinRoom(); return; }
      if (action === 'export') { exportData(); return; }
      if (action === 'clear') { clearData(); return; }

      updateLocal(() => {
        if (action === 'choose-role') state.role = target.dataset.role;
        if (action === 'back-role') {
          state.role = 'none';
          state.roomError = '';
        }
        if (action === 'leave-room') leaveRoom();
        if (action === 'switch-role') state.role = state.role === 'A' ? 'B' : 'A';
        if (action === 'add-task') addTask();
        if (action === 'toggle-task') {
          const task = findTask(target.dataset.id);
          if (task && state.b_state === 'planning') task.done = target.checked;
        }
        if (action === 'start-edit') {
          const task = findTask(target.dataset.id);
          if (task) {
            task.isEditing = true;
            task.editTempText = task.text;
          }
        }
        if (action === 'save-edit') {
          const task = findTask(target.dataset.id);
          if (task) {
            const text = task.editTempText.trim();
            if (text) task.text = text;
            task.isEditing = false;
          }
        }
        if (action === 'cancel-edit') {
          const task = findTask(target.dataset.id);
          if (task) task.isEditing = false;
        }
        if (action === 'delete-task') {
          state.tasks = state.tasks.filter((task) => String(task.id) !== String(target.dataset.id));
        }
        if (action === 'b-satisfied') {
          state.b_satisfied = target.dataset.value === 'true';
          state.b_promptMinimized = false;
        }
        if (action === 'request-next-day') {
          state.b_state = 'waiting';
          state.b_satisfied = null;
          state.b_promptMinimized = false;
        }
        if (action === 'minimize-b-prompt') state.b_promptMinimized = true;
        if (action === 'expand-b-prompt') state.b_promptMinimized = false;
        if (action === 'a-satisfied') {
          state.a_satisfied = target.dataset.value === 'true';
          state.a_promptMinimized = false;
        }
        if (action === 'reward-minus') {
          const value = target.dataset.value;
          state.a_reward[value] = Math.max(0, state.a_reward[value] - 1);
        }
        if (action === 'reward-plus') {
          const value = target.dataset.value;
          state.a_reward[value] += 1;
        }
        if (action === 'approve-next-day') approveNextDay();
        if (action === 'minimize-a-prompt') state.a_promptMinimized = true;
        if (action === 'expand-a-prompt') state.a_promptMinimized = false;
        if (action === 'open-warehouse') state.warehouseOpen = true;
        if (action === 'close-warehouse') state.warehouseOpen = false;
        if (action === 'combine') {
          const value = target.dataset.value;
          if (value === '10' && state.checks[10] >= 2) {
            state.checks[10] -= 2;
            state.checks[20] += 1;
            state.storageLogs.push({ day: state.day, detail: '合成 1 张 ¥20 支票' });
          }
          if (value === '20-10-50' && state.checks[20] >= 2 && state.checks[10] >= 1) {
            state.checks[20] -= 2;
            state.checks[10] -= 1;
            state.checks[50] += 1;
            state.storageLogs.push({ day: state.day, detail: '合成 1 张 ¥50 支票' });
          }
          if (value === '50' && state.checks[50] >= 2) {
            state.checks[50] -= 2;
            state.checks[100] += 1;
            state.storageLogs.push({ day: state.day, detail: '合成 1 张 ¥100 支票' });
          }
        }
      });
    });

    appRoot.addEventListener('dragstart', (event) => {
      const card = event.target.closest('[data-drag-value]');
      if (!card) return;
      const value = Number(card.dataset.dragValue);
      if (state.checks[value] <= 0) {
        event.preventDefault();
        return;
      }
      state.draggedAmount = value;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(value));
    });

    appRoot.addEventListener('dragover', (event) => {
      const zone = event.target.closest('[data-drop-zone]');
      if (!zone) return;
      event.preventDefault();
      if (!state.isDragOver) {
        state.isDragOver = true;
        render();
      }
    });

    appRoot.addEventListener('dragleave', (event) => {
      const zone = event.target.closest('[data-drop-zone]');
      if (!zone) return;
      state.isDragOver = false;
      render();
    });

    appRoot.addEventListener('drop', (event) => {
      const zone = event.target.closest('[data-drop-zone]');
      if (!zone) return;
      event.preventDefault();
      const value = Number(state.draggedAmount || event.dataTransfer.getData('text/plain'));
      updateLocal(() => {
        state.isDragOver = false;
        if (MONEY_VALUES.includes(value) && state.checks[value] > 0) {
          state.checks[value] -= 1;
          state.logs.push({ day: state.day, amount: value });
        }
        state.draggedAmount = null;
      });
    });

    loadLocal();
    render();
  </script>
</body>
</html>
